name: Publish to npm

# Publishes @jylups/cmmn-moddle when a GitHub release is published.
# The release tag must match the package.json version (v5.1.0 for 5.1.0).
# Needs the NPM_TOKEN repository secret.

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        registry-url: 'https://registry.npmjs.org'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Check release tag matches package version
      run: |
        VERSION="v$(node -p "require('./package.json').version")"
        if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "release tag $GITHUB_REF_NAME does not match package version $VERSION"
          exit 1
        fi

    - name: Install dependencies
      run: npm install

    - name: Lint and test
      run: npm run all

    - name: Check package contents
      run: npm pack --dry-run

    - name: Publish
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
